name: Deploy to GitHub Pages

run-name: "Deploy to GitHub Pages by @${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]

# One deploy at a time: a newer merge waits for the running deploy instead of
# racing it on the gh-pages branch (only the latest pending run is kept).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3.3.0
        with:
          # Pinned: an unannounced Hugo release can break the theme build.
          hugo-version: "0.170.0"
          extended: true

      # Hugo 0.170 dropped the embedded LibSass, so the Hugo Book theme's
      # css.Sass needs the Dart Sass binary on PATH.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: "1.108.2"
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate GraphQL docs
        run: npm run generate
        env:
          GRAPHQL_MARKDOWN_TELEMETRY_DEBUG: "1"

      - name: Build
        run: hugo

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
